HomeAssistantFloorPlan.Panel.iconOverrideLabel.tooltip=Icon to use instead of the entity's default icon, e.g., mdi:lamp
HomeAssistantFloorPlan.Panel.attributeLabel.text=Attribute:
HomeAssistantFloorPlan.Panel.attributeLabel.tooltip=Attribute to show in the label instead of the entity's state, e.g., temperature
HomeAssistantFloorPlan.Panel.displayConditionLabel.text=Display condition:
HomeAssistantFloorPlan.Panel.displayConditionLabel.tooltip=<html>When to display the entity, according to its state.<br>Entities that are out of the rendered view aren't displayed by default</html>
