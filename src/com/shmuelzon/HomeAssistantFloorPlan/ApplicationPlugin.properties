HomeAssistantFloorPlan.Panel.detectedLightsTree.root.text=Light Groups
HomeAssistantFloorPlan.Panel.otherEntitiesTreeLabel.text=Other entities:
HomeAssistantFloorPlan.Panel.otherEntitiesTreeLabel.tooltip=Other Home Assistant entities detected in the project. Click an entity to configure it
HomeAssistantFloorPlan.Panel.otherEntitiesTree.root.text=Entities

HomeAssistantFloorPlan.Panel.widthLabel.text=Width:
HomeAssistantFloorPlan.Panel.widthLabel.tooltip=Width, in pixels, of the rendered images
HomeAssistantFloorPlan.Panel.heightLabel.text=Height:
HomeAssistantFloorPlan.Panel.heightLabel.tooltip=Height, in pixels, of the rendered images

HomeAssistantFloorPlan.Panel.lightMixingModeLabel.text=Light mixing mode:
HomeAssistantFloorPlan.Panel.lightMixingModeLabel.tooltip=<html>Choose method for mixing lights:<ul><li>CSS - The browser will combine the different light sources</li><li>Room overlay - All the light combinations for each room are rendered</li><li>Complete renders - All lights combinations are rendered</li></ul></html>
HomeAssistantFloorPlan.Panel.lightMixingModeComboBox.CSS.text=CSS
HomeAssistantFloorPlan.Panel.lightMixingModeComboBox.OVERLAY.text=Room overlay
HomeAssistantFloorPlan.Panel.lightMixingModeComboBox.FULL.text=Complete renders

HomeAssistantFloorPlan.Panel.rendererLabel.text=Renderer:
HomeAssistantFloorPlan.Panel.rendererLabel.tooltip=Rendering engine used for creating the images
HomeAssistantFloorPlan.Panel.qualityLabel.text=Quality:
HomeAssistantFloorPlan.Panel.qualityLabel.tooltip=Rendering quality. High quality renders take significantly longer
HomeAssistantFloorPlan.Panel.qualityComboBox.LOW.text=Low
HomeAssistantFloorPlan.Panel.qualityComboBox.HIGH.text=High

HomeAssistantFloorPlan.Panel.renderTimeLabel.text=Render time:
HomeAssistantFloorPlan.Panel.renderTimeLabel.tooltip=Date and time of the render, affects the sun's position, intensity and color
HomeAssistantFloorPlan.Panel.nightRender.text=Night-time render?
HomeAssistantFloorPlan.Panel.nightRender.tooltip=<html>Render an additional set of images at the given time, displayed during the night.<br>Requires the Sun integration in Home Assistant</html>
HomeAssistantFloorPlan.Panel.imageFormatLabel.text=Image format:
HomeAssistantFloorPlan.Panel.imageFormatLabel.tooltip=File format of the generated images. PNG is lossless, JPEG produces smaller files
HomeAssistantFloorPlan.Panel.imageFormatComboBox.PNG.text=PNG
HomeAssistantFloorPlan.Panel.imageFormatComboBox.JPEG.text=JPEG

HomeAssistantFloorPlan.Panel.renderedFloorsLabel.text=Floors:
HomeAssistantFloorPlan.Panel.renderedFloorsLabel.tooltip=<html>Render only the selected floor, or all floors with buttons for switching between them.<br>Rendering all floors requires the state-switch custom Lovelace card</html>
HomeAssistantFloorPlan.Panel.renderedFloorsComboBox.SELECTED.text=Selected floor (%s)
HomeAssistantFloorPlan.Panel.renderedFloorsComboBox.ALL.text=All floors

HomeAssistantFloorPlan.Panel.outputDirectoryLabel.text=Output directory:
HomeAssistantFloorPlan.Panel.outputDirectoryLabel.tooltip=Directory in which the rendered images and generated YAML are saved
HomeAssistantFloorPlan.Panel.outputDirectory.title=Choose floor-plan output directory
HomeAssistantFloorPlan.Panel.browseButton.text=Browse...
HomeAssistantFloorPlan.Panel.openButton.text=Open

HomeAssistantFloorPlan.Panel.useExistingRenders.text=Use existing renders?
HomeAssistantFloorPlan.Panel.useExistingRenders.tooltip=Enable to use any already rendered images and only generate floor plan and YAML
HomeAssistantFloorPlan.Panel.visibleEntitiesOnly.text=Visible entities only?
HomeAssistantFloorPlan.Panel.visibleEntitiesOnly.tooltip=<html>Enable to only include entities that are seen from the camera, i.e., not outside of the render or hidden behind walls.<br>Lights that aren't seen but light up what's seen are included as well, other lights are turned off</html>

HomeAssistantFloorPlan.Panel.advancedOptionsButton.text=\u2699
HomeAssistantFloorPlan.Panel.advancedOptionsButton.tooltip=Advanced options
HomeAssistantFloorPlan.Panel.advancedOptions.title=Advanced Options
HomeAssistantFloorPlan.Panel.sensitivityLabel.text=Sensitivity:
HomeAssistantFloorPlan.Panel.sensitivityLabel.tooltip=<html>How different a pixel must be from the base image to be included in an overlay image.<br>Only relevant for the room overlay light mixing mode and RGB lights</html>
HomeAssistantFloorPlan.Panel.homeAssistantPathLabel.text=Home Assistant path:
HomeAssistantFloorPlan.Panel.homeAssistantPathLabel.tooltip=<html>The path, as seen by Home Assistant, under which the generated images are stored.<br>Used as the prefix of every image referenced by the generated YAML</html>
HomeAssistantFloorPlan.Panel.addImageVersionTags.text=Add image version tags?
HomeAssistantFloorPlan.Panel.addImageVersionTags.tooltip=<html>Add a version tag, derived from the image's content, to every image referenced by the generated YAML,<br>so Home Assistant reloads an image whenever it changes</html>

HomeAssistantFloorPlan.Panel.displayTypeLabel.text=Display type:
HomeAssistantFloorPlan.Panel.displayTypeLabel.tooltip=How the entity is displayed on the floor plan
HomeAssistantFloorPlan.Panel.displayTypeComboBox.BADGE.text=Badge
HomeAssistantFloorPlan.Panel.displayTypeComboBox.ICON.text=Icon
