HomeAssistantFloorPlan.Panel.info.finishedRendering.text=Finished rendering floor plan

HomeAssistantFloorPlan.Panel.error.title=Error
HomeAssistantFloorPlan.Panel.error.emptyProject.text=No project is open. Please open a project before proceeding.
HomeAssistantFloorPlan.Panel.error.failedRendering.text=Failed to render floor plan:
HomeAssistantFloorPlan.Panel.error.outputDirectoryNotAccessible.text=The output directory can't be accessed. On macOS, Sweet Home 3D runs sandboxed and is only granted access to a directory chosen with the Browse button, until the application is closed. Please click Browse and select the output directory again.
HomeAssistantFloorPlan.Panel.error.failedOpeningOutputDirectory.text=Failed to open the output directory:

HomeAssistantFloorPlan.Panel.detectedLightsTreeLabel.text=Detected lights:
