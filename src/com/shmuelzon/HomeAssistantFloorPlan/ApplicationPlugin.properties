HomeAssistantFloorPlan.Panel.opacityLabel.tooltip=Opacity of the entity's icon/label, 0% is fully transparent
HomeAssistantFloorPlan.Panel.scaleLabel.text=Scale:
HomeAssistantFloorPlan.Panel.scaleLabel.tooltip=Size of the entity's icon/label, relative to its default size
HomeAssistantFloorPlan.Panel.backgroundColorLabel.text=Background color:
HomeAssistantFloorPlan.Panel.backgroundColorLabel.tooltip=Background color of the entity's icon/label, as a CSS color, e.g., rgba(255, 255, 255, 0.3)
HomeAssistantFloorPlan.Panel.alwaysOnLabel.text=Always on:
HomeAssistantFloorPlan.Panel.alwaysOnLabel.tooltip=Render the light as always on, regardless of its state in Home Assistant, without an icon
