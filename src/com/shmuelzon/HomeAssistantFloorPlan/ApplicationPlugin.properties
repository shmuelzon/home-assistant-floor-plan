HomeAssistantFloorPlan.Panel.isRgbLabel.tooltip=<html>Change the light's color and brightness in the floor plan according to its state in Home Assistant.<br>Requires the config-template-card custom Lovelace card and is only supported in the CSS light mixing mode</html>
HomeAssistantFloorPlan.Panel.displayFurnitureConditionLabel.text=Display furniture:
HomeAssistantFloorPlan.Panel.displayFurnitureConditionLabel.tooltip=Display the piece of furniture always, or only when the entity's state is, or isn't, the given value
