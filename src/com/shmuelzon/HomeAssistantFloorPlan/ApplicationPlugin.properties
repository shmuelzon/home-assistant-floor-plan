HomeAssistantFloorPlan.Panel.holdActionLabel.tooltip=Action to perform when the entity is held/long-pressed
HomeAssistantFloorPlan.Panel.actionComboBox.MORE_INFO.text=More info
HomeAssistantFloorPlan.Panel.actionComboBox.NAVIGATE.text=Navigate
HomeAssistantFloorPlan.Panel.actionComboBox.NONE.text=None
HomeAssistantFloorPlan.Panel.actionComboBox.TOGGLE.text=Toggle
HomeAssistantFloorPlan.Panel.actionValueTextField.tooltip=Path to navigate to, e.g., /lovelace/lights
HomeAssistantFloorPlan.Panel.positionLabel.text=Position:
HomeAssistantFloorPlan.Panel.positionLabel.tooltip=Position of the entity's icon/label on the floor plan
HomeAssistantFloorPlan.Panel.positionLeftLabel.text=Left:
HomeAssistantFloorPlan.Panel.positionLeftLabel.tooltip=Distance from the left edge, as a percentage of the image's width
